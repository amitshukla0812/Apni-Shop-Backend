# ---- LOCAL DEVELOPMENT (used as-is when running on your own computer) ----
server.port=8000

spring.datasource.url=jdbc:mysql://localhost:3306/apnishop_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- PRODUCTION (Railway/Render) ----
# You do NOT need to edit this file to deploy. Spring Boot automatically
# overrides the properties above if these environment variables are set on
# the hosting platform (set them in Railway's dashboard, not here):
#   SERVER_PORT                  -> overrides server.port
#   SPRING_DATASOURCE_URL        -> overrides spring.datasource.url
#   SPRING_DATASOURCE_USERNAME   -> overrides spring.datasource.username
#   SPRING_DATASOURCE_PASSWORD   -> overrides spring.datasource.password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Jackson: don't fail on empty POJOs / handle dates nicely
spring.jackson.serialization.write-dates-as-timestamps=false

# Don't fail if incoming JSON (e.g. from old db.json data or the frontend)
# has extra fields the entity doesn't define.
spring.jackson.deserialization.fail-on-unknown-properties=false
